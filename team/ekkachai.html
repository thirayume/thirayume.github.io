<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Ekkachai Khlaimee — AI trainer & co-speaker. Training partner of Thirayu Meererksom.">
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1626;--bg2:#0f2038;--card:#13243f;--ink:#eaf1fb;--soft:#9fb3cf;--mut:#6f86a6;--accent:#3b8fe0;--accent2:#5fd0c8;--line:rgba(255,255,255,.09);--sans:'Inter','Noto Sans Thai',system-ui,sans-serif;--disp:'Sora','Noto Sans Thai',var(--sans)}
html[data-theme="light"]{--bg:#f5f8fc;--bg2:#eef3fa;--card:#fff;--ink:#142035;--soft:#41506a;--mut:#74859f;--line:rgba(15,35,70,.10)}
html[lang="th"]{--sans:'Noto Sans Thai','Inter',sans-serif;--disp:'Noto Sans Thai','Sora',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:880px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:62px;max-width:880px;margin:0 auto;padding:0 24px}
.back{color:var(--soft);font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
.back:hover{color:var(--ink)}
.tools{display:flex;gap:10px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink);font-size:14px}
.iconbtn:hover{border-color:var(--accent)}
.hero{padding:54px 0 30px;display:flex;gap:34px;align-items:center;flex-wrap:wrap}
.hero img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:1px solid var(--line);box-shadow:0 16px 40px -18px rgba(0,0,0,.6)}
.hero .nm{font-family:var(--disp);font-size:clamp(28px,4.6vw,40px);font-weight:800;letter-spacing:-.5px;line-height:1.05}
.hero .rl{color:var(--accent);font-weight:700;font-size:15px;margin-top:8px}
.hero .ct{color:var(--soft);font-size:14px;margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 18px}
.hero .ct a{color:var(--soft)}.hero .ct a:hover{color:var(--accent)}
.partner{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:13px;color:var(--soft)}
.partner b{color:var(--ink)}
section.b{padding:26px 0;border-top:1px solid var(--line)}
h2{font-family:var(--disp);font-size:20px;font-weight:700;margin-bottom:14px}
.lead{color:var(--soft);font-size:15.5px;max-width:70ch}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--accent),transparent)}
.item{position:relative;padding:0 0 22px}
.item::before{content:"";position:absolute;left:-26px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
.item .rw{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.item .t{font-weight:700;font-size:16px}
.item .pd{color:var(--accent);font-weight:700;font-size:12.5px;white-space:nowrap}
.item .o{color:var(--soft);font-size:14px;font-weight:600;margin:1px 0 6px}
.item ul{margin:0 0 0 16px}.item li{color:var(--soft);font-size:14px;margin:3px 0}
.edu{padding:12px 0;border-bottom:1px solid var(--line)}.edu:last-child{border-bottom:0}
.edu .d{font-weight:700;font-size:15px}.edu .o{color:var(--soft);font-size:13.5px}.edu .y{color:var(--accent);font-size:12.5px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:color-mix(in srgb,var(--accent) 13%,transparent);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--mut);font-size:13.5px;text-align:center}
footer a{color:var(--accent)}
@media(max-width:620px){.hero{justify-content:center;text-align:center}.hero .ct{justify-content:center}}
</style>
</head>
<body>
<header><nav>
  <a class="back" href="../index.html#speaking">&#8592; <span data-i18n="back"></span></a>
  <div class="tools"><button class="iconbtn" id="lang">TH</button><button class="iconbtn" id="theme">&#9680;</button></div>
</nav></header>
<main class="wrap">
  <div class="hero">
    <img id="photo" src="" alt="">
    <div>
      <div class="nm" id="nm"></div>
      <div class="rl" id="rl"></div>
      <div class="ct" id="ct"></div>
      <a class="partner" href="../index.html#speaking">&#129309; <span data-i18n="partner"></span> <b>Thirayu Meererksom</b></a>
    </div>
  </div>
  <section class="b"><h2 data-i18n="h.summary"></h2><p class="lead" id="summary"></p></section>
  <section class="b"><h2 data-i18n="h.exp"></h2><div class="tl" id="exp"></div></section>
  <section class="b"><h2 data-i18n="h.edu"></h2><div id="edu"></div></section>
  <section class="b"><h2 data-i18n="h.skills"></h2><div class="chips" id="skills"></div></section>
</main>
<footer><span data-i18n="foot"></span> · <a href="../index.html">thirayume.github.io</a></footer>
<script>
const D={"name": {"en": "Ekkachai Khlaimee", "th": "Ekkachai Khlaimee"}, "role": {"en": "AI Engineer · AI Trainer · Business Development Leader", "th": "AI Engineer · วิทยากร AI · ผู้นำด้านพัฒนาธุรกิจ"}, "photo": "../assets/team/ekkachai.png", "phone": "095-246-4551", "email": "ekkachai.kly@gmail.com", "location": {"en": "Nakhon Ratchasima, Thailand", "th": "นครราชสีมา ประเทศไทย"}, "summary": {"en": "Results-driven AI Engineer and business leader with 15+ years across sales, engineering and AI. Bridges AI technology with business strategy, customer development and organizational efficiency — and shares knowledge as a lecturer and trainer.", "th": "ผู้เชี่ยวชาญด้านการบริหารธุรกิจและการขายกว่า 15 ปี พร้อมประสบการณ์ AI Engineering และการถ่ายทอดองค์ความรู้ เชื่อมโยงเทคโนโลยี AI เข้ากับกลยุทธ์ทางธุรกิจ การพัฒนาลูกค้า และการเพิ่มประสิทธิภาพองค์กร"}, "experience": [{"role": {"en": "AI Engineer", "th": "AI Engineer"}, "org": {"en": "Kasira House Co., Ltd.", "th": "บริษัท คาสิรา เฮาส์ จำกัด"}, "period": "2026 – Present", "bullets": {"en": ["Deliver custom AI solutions with measurable outcomes for clients.", "Scope projects with product managers to align with business goals.", "Engage in AI conferences & workshops to stay current."], "th": ["พัฒนาโซลูชัน AI ตามความต้องการของลูกค้าให้วัดผลได้", "ทำงานร่วมกับ Product Manager กำหนดขอบเขตให้สอดคล้องเป้าหมายธุรกิจ", "ติดตามเทรนด์ AI ผ่านงานประชุมและเวิร์กช็อป"]}}, {"role": {"en": "Lecturer / AI Trainer", "th": "อาจารย์ / วิทยากร AI"}, "org": {"en": "Freelance", "th": "อิสระ"}, "period": "2026 – Present", "bullets": {"en": ["Design and teach AI & technology courses.", "Develop learning materials and hands-on activities.", "Advise organizations on applying AI."], "th": ["ออกแบบและสอนหลักสูตรด้าน AI และเทคโนโลยี", "พัฒนาสื่อการเรียนรู้และกิจกรรมเชิงปฏิบัติการ", "ให้คำปรึกษาการประยุกต์ใช้ AI ในองค์กร"]}}, {"role": {"en": "Sales Manager", "th": "ผู้จัดการฝ่ายขาย"}, "org": {"en": "King of Valve (Nakhonratchasima) Co., Ltd.", "th": "บริษัท คิง ออฟ วาล์ว (นครราชสีมา) จำกัด"}, "period": "2010 – 2025", "bullets": {"en": ["Led the sales team to quarterly targets via strategic planning.", "Built business partnerships driving customer acquisition.", "Increased market share & profitability with innovative strategies."], "th": ["บริหารทีมขายสู่เป้าหมายด้วยการวางแผนเชิงกลยุทธ์", "สร้างพันธมิตรธุรกิจและขยายฐานลูกค้า", "เพิ่มส่วนแบ่งตลาดและกำไรด้วยกลยุทธ์เชิงนวัตกรรม"]}}, {"role": {"en": "Maintenance High-Risk Engineer", "th": "วิศวกรซ่อมบำรุง (งานเสี่ยงสูง)"}, "org": {"en": "Charoen Pokphand Foods (CPF)", "th": "บริษัท เจริญโภคภัณฑ์อาหาร จำกัด (มหาชน)"}, "period": "2010 – 2015", "bullets": {"en": [], "th": []}}, {"role": {"en": "Engineer", "th": "วิศวกร"}, "org": {"en": "Seagate Technology", "th": "ซีเกท เทคโนโลยี"}, "period": "2009 – 2010", "bullets": {"en": [], "th": []}}], "education": [{"degree": {"en": "MBA (Business Management)", "th": "บริหารธุรกิจมหาบัณฑิต"}, "org": {"en": "Sukhothai Thammathirat Open University", "th": "มหาวิทยาลัยสุโขทัยธรรมาธิราช"}, "year": ""}, {"degree": {"en": "B.Eng (Mechanical Engineering)", "th": "วิศวกรรมศาสตรบัณฑิต (วิศวกรรมเครื่องกล)"}, "org": {"en": "Khon Kaen University", "th": "มหาวิทยาลัยขอนแก่น"}, "year": "2009"}], "skills": ["AI & Machine Learning", "Business Development", "Strategic Sales Management", "CRM", "Leadership & Team Coaching", "Market Analysis", "Project Management", "Technical Training & Public Speaking"]};
const LBL={
 en:{back:"Back to Thirayu",partner:"Training partner of","h.summary":"Profile","h.exp":"Experience","h.edu":"Education","h.skills":"Key Skills",foot:"Co-speaker & training-team member of Thirayu Meererksom"},
 th:{back:"กลับไปหน้าหลัก",partner:"พันธมิตรวิทยากรของ","h.summary":"เกี่ยวกับ","h.exp":"ประสบการณ์","h.edu":"การศึกษา","h.skills":"ทักษะหลัก",foot:"วิทยากรร่วมและทีมงานฝึกอบรมของ ถิรายุ มีฤกษ์สม"}
};
let lang=localStorage.getItem("lang")||"en", theme=localStorage.getItem("theme")||"dark";
const $=s=>document.querySelector(s);
function render(){
  document.documentElement.lang=lang; document.documentElement.dataset.theme=theme;
  $("#lang").textContent=lang==="en"?"ไทย":"EN";
  document.querySelectorAll("[data-i18n]").forEach(n=>n.textContent=LBL[lang][n.dataset.i18n]||"");
  $("#photo").src=D.photo; $("#photo").alt=D.name[lang];
  $("#nm").textContent=D.name[lang]; $("#rl").textContent=D.role[lang];
  $("#ct").innerHTML=`<a href="tel:${D.phone}">&#9742; ${D.phone}</a><a href="mailto:${D.email}">&#9993; ${D.email}</a><span>&#9906; ${D.location[lang]}</span>`;
  $("#summary").textContent=D.summary[lang];
  $("#exp").innerHTML=D.experience.map(e=>`<div class="item"><div class="rw"><span class="t">${e.role[lang]}</span><span class="pd">${e.period}</span></div><div class="o">${e.org[lang]}</div>${e.bullets[lang].length?`<ul>${e.bullets[lang].map(b=>`<li>${b}</li>`).join("")}</ul>`:""}</div>`).join("");
  $("#edu").innerHTML=D.education.map(e=>`<div class="edu"><div class="rw"><span class="d">${e.degree[lang]}</span><span class="y">${e.year||""}</span></div><div class="o">${e.org[lang]}</div></div>`).join("");
  $("#skills").innerHTML=D.skills.map(s=>`<span class="chip">${s}</span>`).join("");
  document.title=D.name[lang]+" — Training Team · Thirayu Meererksom";
}
$("#lang").onclick=()=>{lang=lang==="en"?"th":"en";localStorage.setItem("lang",lang);render();};
$("#theme").onclick=()=>{theme=theme==="dark"?"light":"dark";localStorage.setItem("theme",theme);document.documentElement.dataset.theme=theme;};
render();
</script>
</body></html>
